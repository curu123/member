<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#06111d">
<title>RK CELL Member V7 Compact</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --cyan:#45dfff;--green:#00df86;--text:#f4fbff;--muted:#7fa1b3;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030812;color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 50% 0%,rgba(0,194,255,.09),transparent 28%),
    linear-gradient(180deg,#030812,#06111d 50%,#071727);
  padding:10px 0 26px;
}
.member-shell{
  width:min(500px,calc(100% - 12px));margin:0 auto;padding:0 11px 16px;
  border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#06111d 0%,#071522 54%,#081b2a 100%);
  border:2px solid #3e6078;
  box-shadow:0 0 0 3px rgba(118,71,255,.14),0 16px 42px rgba(0,0,0,.45);
}


.phonebar{display:flex;justify-content:space-between;padding:7px 5px 4px;font:800 9px ui-monospace,monospace;color:#d6e5ee}
.title{text-align:center;padding:5px 0 13px}.title h1{margin:0;font:1000 18px ui-monospace,monospace}.title h1 span{color:var(--cyan)}.title small{display:block;color:#7196a8;font:800 8px ui-monospace,monospace;letter-spacing:2px}
.profile{display:grid;grid-template-columns:58px 1fr auto;gap:11px;align-items:center;padding:13px;border:2px solid var(--green);border-radius:16px;background:linear-gradient(135deg,rgba(0,255,156,.06),rgba(0,13,23,.78))}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#50dbff,#0879e9);border:2px solid #84efff}
.name{font:1000 18px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idrow{margin-top:6px;color:#80a7b9;font:900 9px ui-monospace,monospace}.idchip{display:inline-block;margin-left:6px;padding:5px 9px;border-radius:12px;background:#2679ff;color:#fff}
.status{padding:6px 8px;border-radius:12px;border:1px solid rgba(0,255,156,.38);color:#7dffb1;background:rgba(0,255,156,.05);font:900 8px ui-monospace,monospace;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.stat{min-height:94px;padding:14px;border-radius:13px;border:1px solid #29485d;background:linear-gradient(160deg,#0a1b2a,#07131f)}
.stat small{display:block;color:#9db8c6;font:900 8px ui-monospace,monospace}.stat strong{display:block;margin-top:7px;font:1000 27px ui-monospace,monospace}.stat.points strong{color:#ffc63a}.stat.next strong{color:#75d6ff}.sub{margin-top:4px;color:#7da4b7;font-size:9px}
.section{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 8px}.section strong{color:#a5efff;font:1000 11px ui-monospace,monospace}.section span{color:#5ed0f6;font-size:9px}
.rewards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.reward{min-height:121px;padding:9px 4px 7px;text-align:center;border-radius:12px;border:1px solid #d9a62a;background:linear-gradient(180deg,#ffd248 0%,#ffc42b 35%,#f4f1e7 36%,#e8e6dc 100%);color:#17202a}
.reward .rp{font:1000 12px ui-monospace,monospace}.reward .ri{font-size:27px;margin:8px 0 5px}.reward .rn{min-height:26px;font:1000 8px ui-monospace,monospace;text-transform:uppercase}.reward .rs{font:900 8px ui-monospace,monospace;color:#454b52}
.state{display:inline-block;margin-top:5px;padding:3px 5px;border-radius:7px;font:900 6px ui-monospace,monospace}
.history{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;padding:10px 12px;border-radius:11px;border:1px solid #2c516a;background:linear-gradient(135deg,#112b3f,#0b2030)}
.hleft{display:flex;align-items:center;gap:10px}.hicon{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;border:1px solid #3d7596;background:#153d55;color:#c2f2ff}
.hmain b{display:block;font:900 11px ui-monospace,monospace}.hmain small{display:block;margin-top:3px;color:#8ea8b6;font-size:8px}.hright{text-align:right}.date{color:#8099a8;font-size:8px}.poin{margin-top:3px;color:#34e4c4;font:1000 14px ui-monospace,monospace}
.empty{text-align:center;padding:18px;color:#7190a2;font-size:10px}
.error{width:min(460px,calc(100% - 20px));margin:40px auto;padding:20px;border:1px solid #28465a;border-radius:14px;text-align:center;background:#071522}
@media(max-width:420px){
 .member-shell{width:calc(100% - 6px);padding-left:8px;padding-right:8px}
 .profile{grid-template-columns:50px 1fr auto;gap:8px;padding:11px 9px}.avatar{width:48px;height:48px;font-size:24px}.name{font-size:15px}.status{font-size:6px;padding:5px 6px}
 .stat{padding:11px 9px}.stat strong{font-size:22px}.rewards{gap:4px}.reward{min-height:108px;padding-left:2px;padding-right:2px}.reward .ri{font-size:22px}.reward .rn{font-size:6px}
}

/* V2 reward emphasis + admin contact */
.reward.reached{
  position:relative;
  z-index:3;
  transform:scale(1.07);
  border:2px solid #ff4d5e;
  background:linear-gradient(180deg,#ff5968 0%,#e8263b 35%,#fff1f1 36%,#f2dddd 100%);
  box-shadow:0 0 18px rgba(255,55,75,.38),0 8px 18px rgba(0,0,0,.28);
}
.reward.reached .rp{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.28)}
.reward.reached:before{
  content:"✓ TERCAPAI";
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  padding:3px 7px;border-radius:10px;background:#ff2038;color:#fff;
  font:1000 6px ui-monospace,monospace;white-space:nowrap;
  box-shadow:0 3px 8px rgba(0,0,0,.25)
}
.contact-admin{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:18px 0 2px;padding:12px 14px;border-radius:14px;
  text-decoration:none;color:#fff;font:1000 11px ui-monospace,monospace;
  background:linear-gradient(135deg,#0fbd68,#087d4a);
  border:1px solid rgba(105,255,177,.45);
  box-shadow:0 8px 18px rgba(0,0,0,.25)
}
.contact-admin small{font:700 8px system-ui,sans-serif;color:#d9ffeb}
@media(max-width:420px){
  .reward.reached{transform:scale(1.045)}
}


/* V4 member voice assistant */
.voice-welcome{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:8px auto 4px;
  width:max-content;
  max-width:100%;
  padding:6px 10px;
  border-radius:14px;
  border:1px solid rgba(69,223,255,.25);
  background:rgba(69,223,255,.04);
  color:#8feaff;
  font:800 8px ui-monospace,monospace;
  cursor:pointer;
}
.voice-welcome .voice-icon{font-size:13px}
.voice-welcome.speaking{
  border-color:rgba(0,255,156,.4);
  color:#7dffb1;
  box-shadow:0 0 12px rgba(0,255,156,.08);
}


/* V5 claimed reward */
.reward.claimed{
  transform:none!important;
  border:1px solid #6d7480!important;
  background:linear-gradient(180deg,#777d86 0%,#565c65 36%,#e0e2e5 37%,#c5c9ce 100%)!important;
  box-shadow:none!important;
  filter:saturate(.25);
  opacity:.78;
}
.reward.claimed .rp{color:#f3f4f6!important;text-shadow:none!important}
.reward.claimed .ri{filter:grayscale(1);opacity:.72}
.reward.claimed .rn,.reward.claimed .rs{color:#5c626b!important}
.reward.claimed:before{
  content:"✓ SUDAH DIAMBIL";
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  padding:3px 7px;border-radius:10px;background:#626872;color:#fff;
  font:1000 6px ui-monospace,monospace;white-space:nowrap;
}


/* V6 member experience */
.reward-alert{
  margin:12px 0 4px;padding:11px 12px;border-radius:13px;
  background:linear-gradient(135deg,#7d0d18,#d52b3c);
  border:1px solid #ff6574;color:#fff;
  font:900 10px ui-monospace,monospace;text-align:center;
  box-shadow:0 7px 18px rgba(180,20,40,.22)
}
.progress-card{margin-top:10px;padding:11px 12px;border:1px solid #29485d;border-radius:13px;background:#081725}
.progress-head{display:flex;justify-content:space-between;gap:10px;color:#b8d8e7;font:900 9px ui-monospace,monospace}
.progress-track{height:9px;margin-top:8px;border-radius:10px;overflow:hidden;background:#1c3040}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#16b8ff,#00df86);transition:width .5s ease}
.last-tx{margin-top:7px;color:#7fa1b3;font-size:8px;text-align:center}
.claim-btn{
  display:block;margin:7px auto 0;padding:5px 7px;border:0;border-radius:8px;
  background:#fff;color:#c61f31;text-decoration:none;
  font:1000 7px ui-monospace,monospace
}
.reward.reached{animation:rewardPulse 1.8s ease-in-out infinite}
@keyframes rewardPulse{
  0%,100%{box-shadow:0 0 12px rgba(255,55,75,.25),0 8px 18px rgba(0,0,0,.28)}
  50%{box-shadow:0 0 25px rgba(255,55,75,.62),0 8px 18px rgba(0,0,0,.28)}
}

<body>
<div id="app"></div>
<script>
const SUPABASE_URL="https://dguqxtxhfvuoobwraywp.supabase.co";
const SUPABASE_KEY="sb_publishable_5oejSd8dlvNYSuwzNm-W1A_h3Qrn6hj";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let REWARDS=[
 {p:10,name:"Free Admin"},
 {p:20,name:"Free Deterjen"},
 {p:30,name:"Minyak 500 ml"}
];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function rewardIcon(name){
 const n=String(name||"").toLowerCase();
 if(n.includes("minyak")) return "🧴";
 if(n.includes("deterjen")) return "🧼";
 if(n.includes("gula")) return "🛍️";
 if(n.includes("admin")) return "🧾";
 return "🎁";
}

let memberVoiceName = "";
let voiceHasPlayed = false;

function speakMemberWelcome(force=false){
  if(!memberVoiceName || !("speechSynthesis" in window)) return;

  if(voiceHasPlayed && !force) return;

  try{
    window.speechSynthesis.cancel();

    const text=window.memberVoiceMessage || `Selamat datang, ${memberVoiceName}, di Sistem Member RK CELL.`;
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang="id-ID";
    utter.rate=0.96;
    utter.pitch=1.02;
    utter.volume=1;

    const voices=window.speechSynthesis.getVoices();
    const indo=voices.find(v=>/^id(-|_)/i.test(v.lang)) ||
               voices.find(v=>/Indonesia/i.test(v.name));
    if(indo) utter.voice=indo;

    const btn=document.getElementById("voiceWelcomeBtn");
    utter.onstart=()=>{
      voiceHasPlayed=true;
      btn?.classList.add("speaking");
      if(btn) btn.querySelector(".voice-text").textContent="Menyapa Anda...";
    };
    utter.onend=()=>{
      btn?.classList.remove("speaking");
      if(btn) btn.querySelector(".voice-text").textContent="Putar Sapaan";
    };
    utter.onerror=()=>{
      btn?.classList.remove("speaking");
      if(btn) btn.querySelector(".voice-text").textContent="Ketuk untuk dengar sapaan";
    };

    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function setupWelcomeVoice(name){
  memberVoiceName=String(name||"Member RK CELL").trim();

  // Try automatic playback after the member page is fully rendered.
  setTimeout(()=>speakMemberWelcome(false),650);

  // Mobile browsers may require one user interaction.
  const unlock=()=>{
    if(!voiceHasPlayed) speakMemberWelcome(false);
    document.removeEventListener("click",unlock);
    document.removeEventListener("touchstart",unlock);
  };
  document.addEventListener("click",unlock,{once:true});
  document.addEventListener("touchstart",unlock,{once:true});
}

async function init(){
 const id=new URLSearchParams(location.search).get("id");
 if(!id){
   document.getElementById("app").innerHTML='<div class="error">ID member tidak ditemukan pada link.</div>';
   return;
 }
 const [rRes,mRes]=await Promise.all([
   sb.from("rewards").select("*").eq("active",true).order("points_required",{ascending:true}),
   sb.rpc("get_public_member",{p_member_id:id})
 ]);
 if(rRes.data?.length) REWARDS=rRes.data.map(r=>({p:Number(r.points_required),name:r.reward_name}));
 const d=mRes.data;
 if(mRes.error||!d||d.error){
   document.getElementById("app").innerHTML='<div class="error">Member tidak ditemukan.</div>';
   return;
 }
 const pts=Number(d.points||0),claims=d.claims||[],hist=d.history||[];
 const availableRewards=REWARDS.filter(r=>pts>=Number(r.p) && !claims.some(c=>Number(c.points_required)===Number(r.p)));
 const next=REWARDS.find(r=>pts<r.p);
 const previousTarget=[...REWARDS].filter(r=>Number(r.p)<=pts).pop()?.p || 0;
 const progressTarget=next?Number(next.p):Math.max(pts,1);
 const progressBase=next?Number(previousTarget):0;
 const progressPct=next?Math.max(0,Math.min(100,((pts-progressBase)/(progressTarget-progressBase||1))*100)):100;
 const lastTx=hist[0]||null;

 window.memberVoiceMessage=availableRewards.length
   ? `Selamat datang, ${d.name}. Selamat! Anda memiliki ${availableRewards.length} reward yang sudah tersedia dan bisa diklaim di RK CELL.`
   : next
     ? `Selamat datang, ${d.name}, di Sistem Member RK CELL. Saat ini Anda memiliki ${pts} poin. ${Math.max(0,Number(next.p)-pts)} poin lagi menuju reward berikutnya.`
     : `Selamat datang, ${d.name}, di Sistem Member RK CELL. Saat ini Anda memiliki ${pts} poin.`;
 const cards=[...REWARDS];
 while(cards.length<4) cards.push({p:"—",name:"Reward Berikutnya"});

 document.getElementById("app").innerHTML=`<div class="member-shell">
   <div class="phonebar"><span>RK CELL</span><span>● ● ▰</span></div>
   <div class="title">
     <h1>RK <span>CELL</span> MEMBER</h1>
     <small>LOYALTY SYSTEM</small>
     <button class="voice-welcome" id="voiceWelcomeBtn" type="button" onclick="speakMemberWelcome(true)">
       <span class="voice-icon">🔊</span>
       <span class="voice-text">Putar Sapaan</span>
     </button>
   </div>

   <div class="profile">
     <div class="avatar">👤</div>
     <div><div class="name">${esc(d.name)}</div><div class="idrow">ID MEMBER <span class="idchip">${esc(d.id)}</span></div></div>
     <div class="status">${d.active===false?"NONAKTIF":"✓ MEMBER AKTIF"}</div>
   </div>

   <div class="stats">
    <div class="stat points"><small>⭐ TOTAL POIN</small><strong>${pts} <span style="font-size:9px">POIN</span></strong></div>
    <div class="stat next"><small>🎁 NEXT REWARD</small><strong>${next?next.p+" POIN":"SELESAI"}</strong><div class="sub">${next?Math.max(0,next.p-pts)+" poin lagi ke reward berikutnya":"Reward utama tercapai"}</div></div>
   </div>

   ${availableRewards.length?`<div class="reward-alert">🎉 SELAMAT! ${availableRewards.length} REWARD SIAP DIAMBIL</div>`:""}

   <div class="progress-card">
     <div class="progress-head">
       <span>PROGRESS REWARD</span>
       <span>${next?`${pts} / ${next.p} POIN`:`${pts} POIN • TARGET TERCAPAI`}</span>
     </div>
     <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
     <div class="last-tx">${lastTx?`Transaksi terakhir: ${new Date(lastTx.created_at).toLocaleString("id-ID")} • ${Number(lastTx.points)>0?"+":""}${Number(lastTx.points)||0} poin`:"Belum ada transaksi terakhir"}</div>
   </div>

   <div class="section"><strong>REWARD YANG TERSEDIA</strong><span>Lihat Semua ›</span></div>
   <div class="rewards">${cards.slice(0,4).map(r=>{
     if(r.p==="—") return `<div class="reward"><div class="rp">—</div><div class="ri">🎁</div><div class="rn">${esc(r.name)}</div><div class="rs">—</div></div>`;
     const claimed=claims.some(c=>Number(c.points_required)===Number(r.p));
     const reached=pts>=Number(r.p);
     const st=claimed?["DIKLAIM","#dff7e8","#177245"]:reached?["TERSEDIA","#fff0bc","#765800"]:["TERKUNCI","#e5e7eb","#5f6872"];
     const emphasize=reached && !claimed;
     const claimText=encodeURIComponent(`Halo Admin RK CELL, saya ${d.name} (${d.id}). Saya ingin klaim reward: ${r.name} (${r.p} poin).`);
     return `<div class="reward ${claimed?"claimed":(emphasize?"reached":"")}"><div class="rp">${r.p} Poin</div><div class="ri">${rewardIcon(r.name)}</div><div class="rn">${esc(r.name)}</div><div class="rs">${r.p} Poin</div><span class="state" style="background:${st[1]};color:${st[2]}">${st[0]}</span>${emphasize?`<a class="claim-btn" href="https://wa.me/6281271012313?text=${claimText}" target="_blank" rel="noopener">KLAIM VIA ADMIN</a>`:""}</div>`;
   }).join("")}</div>

   <div class="section"><strong>RIWAYAT TRANSAKSI</strong><span>Lihat Semua ›</span></div>
