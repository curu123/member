function showQrToast(text){

function roundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

function fitCanvasText(ctx,text,maxWidth,startSize,minSize=24){
  let size=startSize;
  while(size>minSize){
    ctx.font=`900 ${size}px Arial, sans-serif`;
    if(ctx.measureText(text).width<=maxWidth) break;
    size-=2;
  }
  return size;
}

  }

  showQrToast("Menyiapkan kartu QR...");

  const source=document.getElementById("qrMemberRenderSource");
  if(!source) return;

  source.innerHTML="";
  const memberUrl=`https://curu123.github.io/member/member.html?id=${encodeURIComponent(d.id)}`;

  new QRCode(source,{
    text:memberUrl,
    width:420,
    height:420,
    colorDark:"#06111d",
    colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.H
  });

  await new Promise(resolve=>setTimeout(resolve,180));

  const qrCanvas=source.querySelector("canvas");
  const qrImg=source.querySelector("img");

  const canvas=document.createElement("canvas");
  canvas.width=1080;
  canvas.height=1350;
  const ctx=canvas.getContext("2d");

  // Background.
  const bg=ctx.createLinearGradient(0,0,1080,1350);
  bg.addColorStop(0,"#071426");
  bg.addColorStop(.52,"#07101d");
  bg.addColorStop(1,"#0b2440");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,1080,1350);

  // Decorative glow.
  const glow=ctx.createRadialGradient(160,130,10,160,130,430);
  glow.addColorStop(0,"rgba(69,223,255,.28)");
  glow.addColorStop(1,"rgba(69,223,255,0)");
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,1080,700);

  const glow2=ctx.createRadialGradient(970,1200,10,970,1200,450);
  glow2.addColorStop(0,"rgba(118,71,255,.25)");
  glow2.addColorStop(1,"rgba(118,71,255,0)");
  ctx.fillStyle=glow2;
  ctx.fillRect(500,750,580,600);

  // Outer premium frame.
  roundRect(ctx,38,38,1004,1274,42);
  ctx.strokeStyle="#45dfff";
  ctx.lineWidth=6;
  ctx.stroke();

  roundRect(ctx,58,58,964,1234,34);
  ctx.strokeStyle="rgba(118,71,255,.55)";
  ctx.lineWidth=3;
  ctx.stroke();

  // Logo.
  const logoGrad=ctx.createLinearGradient(95,95,235,235);
  logoGrad.addColorStop(0,"#45dfff");
  logoGrad.addColorStop(1,"#0879e9");
  ctx.fillStyle=logoGrad;
  ctx.beginPath();
  ctx.arc(170,165,72,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#04111d";
  ctx.font="1000 52px Arial, sans-serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText("RK",170,166);

  ctx.textAlign="left";
  ctx.textBaseline="alphabetic";
  ctx.fillStyle="#ffffff";
  ctx.font="1000 62px Arial, sans-serif";
  ctx.fillText("RK CELL",280,158);
  ctx.fillStyle="#45dfff";
  ctx.font="800 28px Arial, sans-serif";
  ctx.fillText("MEMBER LOYALTY SYSTEM",282,202);

  // Member card headline.
  ctx.textAlign="center";
  ctx.fillStyle="#ffffff";
  let nameSize=fitCanvasText(ctx,String(d.name||"MEMBER RK CELL").toUpperCase(),860,58,30);
  ctx.font=`1000 ${nameSize}px Arial, sans-serif`;
  ctx.fillText(String(d.name||"MEMBER RK CELL").toUpperCase(),540,325);

  // Member ID chip.
  roundRect(ctx,310,355,460,72,36);
  ctx.fillStyle="rgba(38,121,255,.22)";
  ctx.fill();
  ctx.strokeStyle="rgba(69,223,255,.70)";
  ctx.lineWidth=2;
  ctx.stroke();
  ctx.fillStyle="#b9f5ff";
  ctx.font="900 28px Arial, sans-serif";
  ctx.fillText(String(d.id||""),540,402);

  // QR white panel.
  roundRect(ctx,230,485,620,620,42);
  ctx.fillStyle="#ffffff";
  ctx.fill();
  ctx.strokeStyle="#45dfff";
  ctx.lineWidth=8;
  ctx.stroke();

  // QR itself.
  if(qrCanvas){
    ctx.drawImage(qrCanvas,310,565,460,460);
  }else if(qrImg){
    await new Promise((resolve,reject)=>{
      if(qrImg.complete) resolve();
      else{
        qrImg.onload=resolve;
        qrImg.onerror=reject;
      }
    }).catch(()=>{});
    if(qrImg.complete) ctx.drawImage(qrImg,310,565,460,460);
  }

  // Corner labels around QR.
  ctx.fillStyle="#45dfff";
  ctx.font="900 24px Arial, sans-serif";
  ctx.textAlign="center";
  ctx.fillText("SCAN QR MEMBER",540,1157);

  ctx.fillStyle="#9ec7d8";
  ctx.font="600 22px Arial, sans-serif";
  ctx.fillText("Scan untuk membuka halaman member RK CELL",540,1196);

  // Footer divider.
  const footGrad=ctx.createLinearGradient(160,0,920,0);
  footGrad.addColorStop(0,"rgba(69,223,255,0)");
  footGrad.addColorStop(.5,"rgba(69,223,255,.8)");
  footGrad.addColorStop(1,"rgba(69,223,255,0)");
  ctx.fillStyle=footGrad;
  ctx.fillRect(170,1230,740,2);

  ctx.fillStyle="#7fa1b3";
  ctx.font="700 20px Arial, sans-serif";
  ctx.fillText("Terima kasih telah menjadi member RK CELL",540,1274);

  // Download.
  const safeName=String(d.name||"member").replace(/[^a-z0-9_-]+/gi,"_").replace(/^_+|_+$/g,"");
  const link=document.createElement("a");
  link.download=`RK_CELL_MEMBER_${safeName||d.id}.png`;
  link.href=canvas.toDataURL("image/png");
  document.body.appendChild(link);
  link.click();
  link.remove();

  showQrToast("Kartu QR berhasil dibuat");
}


let memberVoiceName = "";
let voiceHasPlayed = false;

function speakMemberWelcome(force=false){
  if(!memberVoiceName || !("speechSynthesis" in window)) return;

  if(voiceHasPlayed && !force) return;

  try{
    window.speechSynthesis.cancel();

    const text=window.memberVoiceMessage || `Selamat datang, ${memberVoiceName}, di Sistem Member RK CELL.`;
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang="id-ID";
    utter.rate=0.96;
    utter.pitch=1.02;
    utter.volume=1;

    const voices=window.speechSynthesis.getVoices();
    const indo=voices.find(v=>/^id(-|_)/i.test(v.lang)) ||
               voices.find(v=>/Indonesia/i.test(v.name));
    if(indo) utter.voice=indo;

    const btn=document.getElementById("voiceWelcomeBtn");
    utter.onstart=()=>{
      voiceHasPlayed=true;
      btn?.classList.add("speaking");
      if(btn) btn.querySelector(".voice-text").textContent="Menyapa Anda...";
    };
    utter.onend=()=>{
      btn?.classList.remove("speaking");
      if(btn) btn.querySelector(".voice-text").textContent="Putar Sapaan";
    };
    utter.onerror=()=>{
      btn?.classList.remove("speaking");
      if(btn) btn.querySelector(".voice-text").textContent="Ketuk untuk dengar sapaan";
    };

    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function setupWelcomeVoice(name){
  memberVoiceName=String(name||"Member RK CELL").trim();

  // Try automatic playback after the member page is fully rendered.
  setTimeout(()=>speakMemberWelcome(false),650);

  // Mobile browsers may require one user interaction.
  const unlock=()=>{
    if(!voiceHasPlayed) speakMemberWelcome(false);
    document.removeEventListener("click",unlock);
    document.removeEventListener("touchstart",unlock);
  };
  document.addEventListener("click",unlock,{once:true});
  document.addEventListener("touchstart",unlock,{once:true});
}


function toggleAdminContact(){
  const panel=document.getElementById("adminContactPanel");
  panel?.classList.toggle("open");
}
document.addEventListener("click",e=>{
  const panel=document.getElementById("adminContactPanel");
  const btn=document.getElementById("adminContactToggle");
  if(!panel || !btn) return;
  if(panel.classList.contains("open") && !panel.contains(e.target) && !btn.contains(e.target)){
    panel.classList.remove("open");
  }
});
